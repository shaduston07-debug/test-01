# Publishes the web version (for iPad "Add to Home Screen") by updating the
# gh-pages branch, which GitHub Pages serves at
# https://shaduston07-debug.github.io/test-01/
name: Home Screen web app

on:
  workflow_dispatch:
  push:
    branches: [claude/inkwell-studio, main]
    paths: ['js/**', 'css/**', 'index.html', 'sw.js', 'manifest.webmanifest', 'vendor/**', 'icons/**', '.github/workflows/pages.yml']

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-www.mjs && touch www/.nojekyll
      - name: Push to gh-pages
        run: |
          cd www
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
