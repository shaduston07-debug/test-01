# Builds the native iPad app on a GitHub-hosted Mac and uploads an unsigned .ipa.
# Install it with Sideloadly / AltStore (they re-sign with your free Apple ID),
# or open ios/App in Xcode to sign and run it yourself.
name: iPad app

on:
  workflow_dispatch:
  push:
    branches: [claude/inkwell-studio, main]
    paths: ['js/**', 'css/**', 'index.html', 'ios/**', 'vendor/**', 'art/**', 'icons/**', 'package*.json', 'capacitor.config.json', '.github/workflows/ios.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # version shown in the app (Settings), matching the .ipa's version
      - name: Stamp version
        run: |
          echo "export const VERSION = { version: '1.0.${GITHUB_RUN_NUMBER}', build: '${GITHUB_RUN_NUMBER}', commit: '${GITHUB_SHA::7}', date: '$(date -u +%Y-%m-%d)' };" > js/version.js
      - run: npm run build && npx cap sync ios
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry InkwellStudio.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: InkwellStudio-ipa
          path: InkwellStudio.ipa
          retention-days: 30
      # Easy-to-find download: Releases section on the repo's front page
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest InkwellStudio.ipa --target "$GITHUB_SHA" \
            --title "Inkwell Studio for iPad (latest build)" \
            --notes "Download **InkwellStudio.ipa** below, then install it with Sideloadly or AltStore from a computer. Built from ${GITHUB_SHA::7}." 
      # Copy on a branch too, so it shows up in the file list
      - name: Update download branch
        run: |
          mkdir dl && cp InkwellStudio.ipa dl/ && cd dl
          # SideStore / AltStore source: add https://raw.githubusercontent.com/<repo>/download/sidestore.json
          # in SideStore › Sources, then install and update Inkwell Studio from Browse (no Safari download)
          python3 - <<'PY'
          import json, os, datetime
          repo = os.environ['GITHUB_REPOSITORY']; run = os.environ['GITHUB_RUN_NUMBER']; sha = os.environ['GITHUB_SHA'][:7]
          owner, name = repo.split('/')
          icon = f'https://{owner}.github.io/{name}/icons/icon-512.png'
          src = {
            'name': 'Inkwell', 'identifier': f'io.github.{owner}.{name}.inkwell', 'subtitle': 'Inkwell Studio for iPad',
            'iconURL': icon, 'website': f'https://github.com/{repo}', 'tintColor': '#7b5cff',
            'apps': [{
              'name': 'Inkwell Studio', 'bundleIdentifier': 'com.inkwell.studio', 'developerName': 'Inkwell',
              'subtitle': 'Paint, animate and make webtoons', 'iconURL': icon, 'tintColor': '#7b5cff',
              'localizedDescription': 'Painting, animation and webtoon app with Inkwell Learning courses.',
              'versions': [{
                'version': f'1.0.{run}', 'buildVersion': run,
                'date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                'localizedDescription': f'Build {run} from {sha}',
                'downloadURL': f'https://github.com/{repo}/releases/download/latest/InkwellStudio.ipa',
                'size': os.path.getsize('InkwellStudio.ipa'), 'minOSVersion': '15.0',
              }],
              'appPermissions': {'entitlements': [], 'privacy': {}},
            }],
            'news': [],
          }
          json.dump(src, open('sidestore.json', 'w'), indent=1)
          PY
          git init -q -b download
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "iPad app build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" download
